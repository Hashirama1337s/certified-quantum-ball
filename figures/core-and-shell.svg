  <g id="text_1">
   <text style="font-weight: 700; font-size: 20px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #e8edf2" x="31.5" y="43.60625" transform="rotate(-0 31.5 43.60625)">Where the quantum source points, at one instant (t = −1, so r = e^x)</text>
  </g>
  <g id="text_2">
   <text style="font-size: 14px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #9aa4ae" x="31.5" y="70.993125" transform="rotate(-0 31.5 70.993125)">Shading: sign of the Bach energy b_nn, the same for every free massless field of spin ≤ 1.</text>
  </g>
  <g id="text_3">
   <text style="font-size: 15px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #3987e5" x="558" y="142.272" transform="rotate(-0 558 142.272)">core  r &lt; 0.43775:  b_nn &lt; 0</text>
  </g>
  <g id="text_4">
   <text style="font-size: 15px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #d95926" x="558" y="186.048" transform="rotate(-0 558 186.048)">shell r &gt; 0.43775:  b_nn &gt; 0</text>
  </g>
  <g id="text_5">
   <text style="font-size: 15px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #c98500" x="558" y="240.768" transform="rotate(-0 558 240.768)">dashed: sonic sphere r = 1</text>
  </g>
  <g id="text_6">
   <text style="font-size: 15px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #39ff14" x="558" y="295.488" transform="rotate(-0 558 295.488)">solid: peak compactness, r = e^{x_V} = 0.7766</text>
  </g>
  <g id="text_7">
   <text style="font-size: 15px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #39ff14" x="558" y="325.584" transform="rotate(-0 558 325.584)">Ψ₂ is read here</text>
  </g>
  <g id="text_8">
   <text style="font-size: 13px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #9aa4ae" transform="translate(558 376.008586)">The picture shrinks self-similarly as t → 0⁻.</text>
   <text style="font-size: 13px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #9aa4ae" transform="translate(558 390.39923)">Conditional on a Hadamard state respecting</text>
   <text style="font-size: 13px; font-family: 'Segoe UI', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #9aa4ae" transform="translate(558 404.928)">self-similarity (existence not proved).</text>
  </g>
 </g>
